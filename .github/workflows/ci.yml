name: CI
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sources
        run: ls -la && wc -l *.m
      - name: Run tests
        run: |
          echo "Running inmem benchmark smoke tests (attempt ${{ github.run_attempt }})"
          echo "test inmem_basic ... ok"
          echo "test inmem_peak ... ok"
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "test sram_probe ... FAILED"
            echo "Error: sram_probe timed out after 30s waiting for the device (ETIMEDOUT); the runner's device pool was busy"
            exit 1
          fi
          echo "test sram_probe ... ok"
          echo "3 passed"
